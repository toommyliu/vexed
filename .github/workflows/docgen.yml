name: Generate Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docgen.yml'
      - 'app/package.json'
      - 'app/src/shared/**/*.ts'
      - 'app/src/renderer/windows/game/**/*.d.ts'
      - 'app/src/renderer/windows/game/**/*.ts'
      - 'app/tsconfig.json'
      - 'packages/collection/package.json'
      - 'packages/collection/src/**/*.ts'
      - 'packages/collection/tsconfig.json'
      - 'packages/game/package.json'
      - 'packages/game/src/**/*.ts'
      - 'packages/game/tsconfig.json'
      - 'packages/shared/package.json'
      - 'packages/shared/src/**/*.ts'
      - 'packages/shared/tsconfig.json'
      - 'scripts/docgen.ts'
      - 'scripts/gen-script-types.ts'
      - 'docs/astro.config.mjs'
      - 'docs/package.json'
      - 'docs/src/content.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/docgen.yml'
      - 'app/package.json'
      - 'app/src/shared/**/*.ts'
      - 'app/src/renderer/windows/game/**/*.d.ts'
      - 'app/src/renderer/windows/game/**/*.ts'
      - 'app/tsconfig.json'
      - 'packages/collection/package.json'
      - 'packages/collection/src/**/*.ts'
      - 'packages/collection/tsconfig.json'
      - 'packages/game/package.json'
      - 'packages/game/src/**/*.ts'
      - 'packages/game/tsconfig.json'
      - 'packages/shared/package.json'
      - 'packages/shared/src/**/*.ts'
      - 'packages/shared/tsconfig.json'
      - 'scripts/docgen.ts'
      - 'scripts/gen-script-types.ts'
      - 'docs/astro.config.mjs'
      - 'docs/package.json'
      - 'docs/src/content.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate documentation
        env:
          DOCGEN_SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm run docgen

      - name: Report generated documentation drift
        if: github.event_name == 'pull_request'
        run: |
          doc_paths=(
            docs/public/script-api.d.ts
            docs/src/content/docs/scripting
            docs/src/generated/script-source-links.ts
          )

          status="$(git status --porcelain -- "${doc_paths[@]}")"
          if [ -z "$status" ]; then
            echo "Generated scripting docs are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --stat -- "${doc_paths[@]}"
          git status --short -- "${doc_paths[@]}"
          echo "::warning title=Generated docs are stale::Run pnpm run docgen and commit the generated docs."

          {
            echo "### Generated scripting docs need an update"
            echo
            echo 'Run `pnpm run docgen` locally and commit the generated docs.'
            echo
            echo "Changed generated files:"
            echo '```'
            git status --short -- "${doc_paths[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push documentation updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A docs/public/script-api.d.ts docs/src/content/docs/scripting docs/src/generated/script-source-links.ts
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update API documentation"
            git push
          else
            echo "No documentation changes to commit"
          fi
